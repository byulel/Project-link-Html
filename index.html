<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" media="print" onload="this.media='all'">
<title>Résidence Ben Rhouma — Mnâkaa</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #080808; color: #f0ece4; overflow: hidden; }

  /* LOADER */
  .loader {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 999;
    background: #080808;
    display: -webkit-flex; display: flex;
    -webkit-flex-direction: column; flex-direction: column;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    transition: opacity 0.6s ease, visibility 0.6s;
  }
  .loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .loader-brand {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 14px; font-weight: 400; letter-spacing: 5px;
    text-transform: uppercase; color: #c9a96e; text-align: center; line-height: 1.6;
  }
  .loader-brand strong { font-weight: 600; font-size: 22px; letter-spacing: 7px; display: block; }
  .loader-line {
    width: 40px; height: 1px; background: #c9a96e; margin-top: 24px;
    animation: loadPulse 1.2s ease infinite;
  }
  @keyframes loadPulse {
    0%, 100% { opacity: 0.3; -webkit-transform: scaleX(1); transform: scaleX(1); }
    50% { opacity: 1; -webkit-transform: scaleX(1.5); transform: scaleX(1.5); }
  }

  /* TOP BAR */
  .top {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: space-between; justify-content: space-between;
    padding: 24px 32px;
    background: -webkit-linear-gradient(top, rgba(8,8,8,0.95) 0%, rgba(8,8,8,0.4) 60%, transparent 100%);
    background: linear-gradient(to bottom, rgba(8,8,8,0.95) 0%, rgba(8,8,8,0.4) 60%, transparent 100%);
    opacity: 0;
    animation: slideDown 0.8s ease 0.8s forwards;
  }
  @keyframes slideDown {
    from { opacity: 0; -webkit-transform: translateY(-10px); transform: translateY(-10px); }
    to { opacity: 1; -webkit-transform: translateY(0); transform: translateY(0); }
  }
  .brand {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 13px; font-weight: 500; letter-spacing: 4px;
    text-transform: uppercase; color: #c9a96e;
  }
  .brand strong { font-weight: 600; font-size: 15px; display: block; letter-spacing: 6px; }
  .loc {
    font-family: 'Inter', Helvetica, sans-serif;
    font-size: 11px; letter-spacing: 3px; text-transform: uppercase;
    color: rgba(240,236,228,0.35);
  }

  /* TABS */
  .tabs {
    position: fixed; top: 68px; left: 50%;
    -webkit-transform: translateX(-50%); transform: translateX(-50%);
    z-index: 100;
    display: -webkit-flex; display: flex; gap: 2px;
    background: rgba(16,16,16,0.75);
    -webkit-backdrop-filter: blur(24px) saturate(1.2);
    backdrop-filter: blur(24px) saturate(1.2);
    border: 1px solid rgba(201,169,110,0.1);
    border-radius: 50px; padding: 5px;
    opacity: 0;
    animation: fadeUp 0.8s ease 1s forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; -webkit-transform: translateX(-50%) translateY(10px); transform: translateX(-50%) translateY(10px); }
    to { opacity: 1; -webkit-transform: translateX(-50%) translateY(0); transform: translateX(-50%) translateY(0); }
  }
  .tab {
    background: none; border: none;
    color: rgba(240,236,228,0.35);
    font-family: 'Inter', Helvetica, sans-serif;
    font-size: 11px; font-weight: 400; letter-spacing: 1.5px;
    text-transform: uppercase; padding: 10px 18px;
    border-radius: 46px; cursor: pointer;
    -webkit-transition: all 0.4s ease; transition: all 0.4s ease;
    white-space: nowrap; z-index: 1;
  }
  .tab .num {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 17px; font-weight: 500; letter-spacing: 0;
  }
  .tab:hover { color: #f0ece4; }
  .tab.active { color: #080808; background: #c9a96e; font-weight: 500; }
  .tab.active .num { color: #080808; }

  /* VIEWER */
  .viewer {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
  }
  .photo-wrap {
    position: relative; width: 100%; height: 100%;
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
  }
  .photo-wrap img {
    max-width: 100vw; max-height: 100vh; width: 100%; height: 100%;
    object-fit: contain; opacity: 0;
    -webkit-transition: opacity 0.25s ease, -webkit-transform 0.25s ease;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .photo-wrap img.visible { opacity: 1; }
  .photo-wrap img.out-left { -webkit-transform: translateX(-40px); transform: translateX(-40px); opacity: 0; }
  .photo-wrap img.out-right { -webkit-transform: translateX(40px); transform: translateX(40px); opacity: 0; }

  /* VIGNETTE */
  .vignette {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none; z-index: 10;
    background: -webkit-radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.25) 70%, rgba(0,0,0,0.6) 100%);
    background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,0.25) 70%, rgba(0,0,0,0.6) 100%);
  }

  /* NAV ARROWS */
  .nav-area {
    position: fixed; top: 0; bottom: 0; width: 14%; min-width: 50px;
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    z-index: 50; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    -webkit-transition: background 0.3s; transition: background 0.3s;
  }
  .nav-area:hover { background: rgba(201,169,110,0.03); }
  .nav-left { left: 0; }
  .nav-right { right: 0; }
  .nav-arrow {
    width: 44px; height: 44px;
    border: 1px solid rgba(201,169,110,0.2); border-radius: 50%;
    display: -webkit-flex; display: flex;
    -webkit-align-items: center; align-items: center;
    -webkit-justify-content: center; justify-content: center;
    opacity: 0;
    -webkit-transition: all 0.4s ease; transition: all 0.4s ease;
    background: rgba(8,8,8,0.4);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .nav-area:hover .nav-arrow { opacity: 1; }
  .nav-arrow svg {
    width: 18px; height: 18px; stroke: #c9a96e;
    stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round;
  }

  /* BOTTOM */
  .bottom {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
    display: -webkit-flex; display: flex;
    -webkit-flex-direction: column; flex-direction: column;
    -webkit-align-items: center; align-items: center;
    padding-bottom: 28px;
    background: -webkit-linear-gradient(top, rgba(8,8,8,0.95) 0%, rgba(8,8,8,0.5) 50%, transparent 100%);
    background: linear-gradient(to top, rgba(8,8,8,0.95) 0%, rgba(8,8,8,0.5) 50%, transparent 100%);
    opacity: 0;
    animation: slideUp 0.8s ease 1.2s forwards;
  }
  @keyframes slideUp {
    from { opacity: 0; -webkit-transform: translateY(10px); transform: translateY(10px); }
    to { opacity: 1; -webkit-transform: translateY(0); transform: translateY(0); }
  }
  .floor-name {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 20px; font-weight: 400; letter-spacing: 3px;
    text-transform: uppercase; color: #c9a96e; margin-bottom: 14px;
  }
  .progress-track {
    width: 120px; height: 2px; background: rgba(201,169,110,0.15);
    border-radius: 1px; overflow: hidden; margin-bottom: 12px;
  }
  .progress-fill {
    height: 100%; background: #c9a96e; border-radius: 1px;
    -webkit-transition: width 0.5s ease; transition: width 0.5s ease;
  }
  .counter {
    font-family: 'Inter', Helvetica, sans-serif;
    font-size: 15px; letter-spacing: 5px;
    color: rgba(240,236,228,0.35);
    text-transform: uppercase; font-weight: 300;
  }
  .counter .num { color: #f0ece4; font-weight: 500; font-size: 20px; }

  .hint { display: none; }

  /* MOBILE */
  @media (max-width: 768px) {
    .top { padding: 14px 16px; }
    .brand { font-size: 11px; letter-spacing: 3px; }
    .brand strong { font-size: 13px; letter-spacing: 4px; }
    .loc { font-size: 9px; letter-spacing: 2px; }
    .tabs {
      top: 52px; gap: 1px; padding: 3px;
      border-radius: 40px; max-width: calc(100vw - 32px);
      overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { padding: 8px 12px; font-size: 10px; letter-spacing: 1px; border-radius: 36px; }
    .tab .num { font-size: 14px; }
    .nav-area { width: 20%; min-width: 44px; }
    .nav-arrow { width: 38px; height: 38px; opacity: 0.5; border-color: rgba(201,169,110,0.15); }
    .nav-arrow svg { width: 16px; height: 16px; }
    .floor-name { font-size: 15px; letter-spacing: 2px; margin-bottom: 10px; }
    .progress-track { width: 80px; margin-bottom: 8px; }
    .bottom { padding-bottom: 20px; }
    .counter { font-size: 14px; letter-spacing: 3px; }
    .counter .num { font-size: 18px; }
    .vignette {
      background: -webkit-radial-gradient(ellipse at center, transparent 20%, rgba(0,0,0,0.3) 60%, rgba(0,0,0,0.5) 100%);
      background: radial-gradient(ellipse at center, transparent 20%, rgba(0,0,0,0.3) 60%, rgba(0,0,0,0.5) 100%);
    }
  }
</style>
</head>
<body>

<div class="loader" id="loader">
  <div class="loader-brand">Résidence<br><strong>Ben Rhouma</strong></div>
  <div class="loader-line"></div>
</div>

<div class="top">
  <div class="brand">Résidence<br><strong>Ben Rhouma</strong></div>
  <div class="loc">Mnâkaa, Tunisie</div>
</div>

<div class="tabs" id="tabs">
  <button class="tab active" data-floor="lieu">Lieu</button>
  <button class="tab" data-floor="rdc"><span class="num">R</span>DC</button>
  <button class="tab" data-floor="etage1"><span class="num">1</span>er</button>
  <button class="tab" data-floor="etage2"><span class="num">2</span>ème</button>
  <button class="tab" data-floor="etage3"><span class="num">3</span>ème</button>
</div>

<div class="viewer">
  <div class="photo-wrap" id="photoWrap">
    <img id="photo" src="Lieu/photo-1.jpeg" alt="">
  </div>
</div>
<div class="vignette"></div>

<div class="nav-area nav-left" onclick="nav(-1)">
  <div class="nav-arrow"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></div>
</div>
<div class="nav-area nav-right" onclick="nav(1)">
  <div class="nav-arrow"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></div>
</div>

<div class="bottom">
  <div class="floor-name" id="floorName">Lieu</div>
  <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
  <div class="counter" id="counter"><span class="num">1</span> / 7</div>
</div>

<script>
function genPhotos(n) {
  var a = [];
  for (var i = 1; i <= n; i++) a.push('photo-' + i + '.jpeg');
  return a;
}

var F = {
  lieu:   { name: 'Lieu',             photos: genPhotos(7) },
  rdc:    { name: 'Rez-de-chaussée',  photos: genPhotos(9) },
  etage1: { name: '1er Étage',        photos: genPhotos(8) },
  etage2: { name: '2ème Étage',       photos: genPhotos(17) },
  etage3: { name: '3ème Étage',       photos: genPhotos(12) }
};

var folders = {
  lieu: 'Lieu', rdc: 'RDC', etage1: 'Etage-1', etage2: 'Etage-2', etage3: 'Etage-3'
};

var cur = 'lieu', idx = 0, animating = false;
var photo = document.getElementById('photo');
var floorName = document.getElementById('floorName');
var progress = document.getElementById('progress');
var counter = document.getElementById('counter');
var preloaded = {};

function preload(folder, arr, i) {
  var key = folder + '-' + i;
  if (preloaded[key]) return;
  var img = new Image();
  img.src = folder + '/' + arr[i];
  preloaded[key] = true;
}

function preloadAdjacent() {
  var p = F[cur].photos;
  var folder = folders[cur];
  var n = p.length;
  preload(folder, p, (idx + 1) % n);
  preload(folder, p, (idx - 1 + n) % n);
}

function show(dir) {
  var p = F[cur].photos;
  var folder = folders[cur];

  photo.className = '';
  photo.classList.add(dir >= 0 ? 'out-left' : 'out-right');

  var img = new Image();
  var ready = false;
  function onReady() {
    if (ready) return;
    ready = true;
    photo.src = img.src;
    photo.className = dir >= 0 ? 'out-right' : 'out-left';
    void photo.offsetHeight;
    photo.className = 'visible';
    animating = false;
    preloadAdjacent();
  }
  img.onload = onReady;
  img.onerror = onReady;
  img.src = folder + '/' + p[idx];
  if (img.complete && img.naturalWidth > 0) onReady();

  floorName.textContent = F[cur].name;
  counter.innerHTML = '<span class="num">' + (idx + 1) + '</span> / ' + p.length;
  progress.style.width = ((idx + 1) / p.length * 100) + '%';
}

function nav(d) {
  var p = F[cur].photos;
  idx = (idx + d + p.length) % p.length;
  show(d);
}

function setFloor(id) {
  cur = id;
  idx = 0;
  var tabs = document.querySelectorAll('.tab');
  for (var t = 0; t < tabs.length; t++) {
    tabs[t].classList.toggle('active', tabs[t].getAttribute('data-floor') === id);
  }
  show(1);
}

var tabs = document.querySelectorAll('.tab');
for (var t = 0; t < tabs.length; t++) {
  tabs[t].addEventListener('click', function() {
    setFloor(this.getAttribute('data-floor'));
  });
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowLeft') nav(-1);
  if (e.key === 'ArrowRight') nav(1);
  var keys = ['lieu','rdc','etage1','etage2','etage3'];
  var num = parseInt(e.key);
  if (num >= 1 && num <= 5) setFloor(keys[num - 1]);
});

var sx = 0;
document.addEventListener('touchstart', function(e) { sx = e.touches[0].clientX; }, {passive:true});
document.addEventListener('touchend', function(e) {
  var dx = e.changedTouches[0].clientX - sx;
  if (Math.abs(dx) > 50) nav(dx > 0 ? -1 : 1);
}, {passive:true});

function startSite() {
  document.getElementById('loader').classList.add('hidden');
  photo.classList.add('visible');
  preloadAdjacent();
}

var started = false;
function ensureStart() {
  if (started) return;
  started = true;
  startSite();
}

if (document.readyState === 'complete') {
  setTimeout(ensureStart, 800);
} else {
  window.addEventListener('load', function() { setTimeout(ensureStart, 800); });
}
setTimeout(ensureStart, 2000);
</script>

</body>
</html>
