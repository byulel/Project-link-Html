<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" media="print" onload="this.media='all'">
<title>Résidence Ben Rhouma — Mnâkaa</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="loader" id="loader">
  <div class="loader-brand">Résidence<br><strong>Ben Rhouma</strong></div>
  <div class="loader-line"></div>
</div>

<div class="top">
  <div class="brand">Résidence<br><strong>Ben Rhouma</strong></div>
  <div class="loc">Mnâkaa, Tunisie</div>
</div>

<div class="tabs" id="tabs">
  <button class="tab active" data-floor="lieu">Lieu</button>
  <button class="tab" data-floor="rdc"><span class="num">R</span>DC</button>
  <button class="tab" data-floor="etage1"><span class="num">1</span>er</button>
  <button class="tab" data-floor="etage2"><span class="num">2</span>ème</button>
  <button class="tab" data-floor="etage3"><span class="num">3</span>ème</button>
</div>

<div class="viewer">
  <div class="photo-wrap" id="photoWrap">
    <img id="photo" src="Lieu/photo-1.jpeg" alt="">
  </div>
</div>
<div class="vignette"></div>

<div class="nav-area nav-left" onclick="nav(-1)">
  <div class="nav-arrow"><svg viewBox="0 0 24 24"><path d="M15 19l-7-7 7-7"/></svg></div>
</div>
<div class="nav-area nav-right" onclick="nav(1)">
  <div class="nav-arrow"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></div>
</div>

<div class="bottom">
  <div class="floor-name" id="floorName">Lieu</div>
  <div class="progress-track"><div class="progress-fill" id="progress"></div></div>
  <div class="counter" id="counter"><span class="num">1</span> / 7</div>
</div>

<script src="script.js"></script>

</body>
</html>
